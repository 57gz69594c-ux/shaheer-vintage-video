<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<script>
// GitHub Pages serves this with Cache-Control: max-age=600, so the R1's
// webview can keep serving a stale cached copy for up to 10 minutes (or
// longer, depending on how it caches installed Creations) after a fix ships.
// A unique query string on first load forces a real network fetch every
// time the app is opened, so updates always take effect immediately.
if (!location.search.includes('v=')) {
  location.replace(location.pathname + '?v=' + Date.now());
}
</script>
<title>16/8mm Film Video</title>
<style>
  html,body{margin:0;padding:0;width:240px;height:282px;background:#000;color:#fff;
    font-family:-apple-system,sans-serif;overflow:hidden;font-size:11px;
    -webkit-tap-highlight-color:transparent;}
  #camera{width:100%;height:100%;position:relative;display:none;}
  #camera.active{display:block;}
  video#src{display:none;}
  canvas#preview{width:100%;height:100%;object-fit:cover;display:block;background:#000;}

  #modeLabel{position:absolute;bottom:14px;left:8px;
    background:rgba(20,20,20,.75);border:1px solid rgba(255,255,255,.2);border-radius:999px;
    padding:4px 10px;font-size:10px;letter-spacing:.06em;font-weight:600;text-align:center;}
  #modeLabel .stock{display:block;font-size:8px;font-weight:400;opacity:.65;letter-spacing:.04em;}

  #recIndicator{position:absolute;top:6px;left:50%;transform:translateX(-50%);
    display:none;align-items:center;gap:4px;
    background:rgba(0,0,0,.55);border-radius:999px;padding:3px 7px;font-size:10px;
    font-variant-numeric:tabular-nums;}
  #recIndicator.on{display:flex;}
  #recDot{width:7px;height:7px;border-radius:50%;background:#e03b3b;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}

  #galleryBtn{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    background:rgba(20,20,20,.75);border:1px solid rgba(255,255,255,.2);color:#eee;
    font-size:12px;display:flex;align-items:center;justify-content:center;}

  #rotateBtn{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;
    background:rgba(20,20,20,.75);border:1px solid rgba(255,255,255,.2);color:#eee;
    font-size:13px;display:flex;align-items:center;justify-content:center;}

  #hint{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;opacity:.6;}

  #err{position:absolute;top:0;left:0;right:0;padding:8px;background:#500;font-size:10px;
    display:none;z-index:10;}

  #gallery{display:none;padding:8px;height:100%;box-sizing:border-box;overflow-y:auto;}
  #gallery.active{display:block;}
  #gallery h3{margin:0 0 6px;font-size:12px;}
  .clip{padding:6px;margin-bottom:4px;background:#1c1c1c;border-radius:5px;display:flex;
    align-items:center;justify-content:space-between;gap:6px;}
  .clip.sel{background:#3a3050;}
  .clip .info{display:flex;flex:1;justify-content:space-between;overflow:hidden;}
  .clip .badge{opacity:.6;}
  .clipDelete{flex-shrink:0;width:20px;height:20px;border-radius:4px;
    border:1px solid rgba(224,59,59,.4);background:rgba(224,59,59,.15);color:#ff6b6b;
    font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .clipShare{flex-shrink:0;width:26px;height:20px;border-radius:4px;
    border:1px solid rgba(226,192,132,.5);background:rgba(226,192,132,.15);color:#e2c084;
    font-size:8px;font-weight:700;letter-spacing:.03em;line-height:1;
    display:flex;align-items:center;justify-content:center;}

  #share{display:none;padding:14px 10px;height:100%;box-sizing:border-box;
    flex-direction:column;align-items:center;text-align:center;}
  #share.active{display:flex;}
  #share h3{margin:6px 0 10px;font-size:12px;}
  #shareStatus{font-size:11px;opacity:.85;}
  #shareError{font-size:10px;color:#ff6b6b;padding:0 6px;}
  #shareErrorMsg{margin-bottom:8px;}
  #shareDiag{font-size:9px;opacity:.75;text-align:left;margin-bottom:10px;
    background:rgba(255,255,255,.05);border-radius:6px;padding:6px 8px;line-height:1.6;}
  #shareDiag div{display:flex;justify-content:space-between;gap:8px;}
  #shareDiag .ok{color:#7ee08a;}
  #shareDiag .fail{color:#ff6b6b;}
  #shareDiag .pending{opacity:.5;}
  #shareErrorActions{display:flex;gap:8px;justify-content:center;}
  #shareErrorActions button{font-size:10px;font-weight:600;padding:6px 12px;border-radius:999px;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#eee;}
  #shareRetryBtn{border-color:rgba(226,192,132,.5) !important;background:rgba(226,192,132,.15) !important;
    color:#e2c084 !important;}
  #shareQrWrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #shareImg{border-radius:8px;background:#fff;padding:6px;display:block;}
  #shareUrl{font-size:8px;opacity:.4;word-break:break-all;max-width:200px;}
  #shareExpiry{font-size:9px;opacity:.6;}
  #shareHint{font-size:9px;opacity:.6;margin-top:auto;padding-top:10px;}
  #galleryHint{font-size:9px;opacity:.7;margin-top:4px;}
  #galleryEmpty{opacity:.6;padding:10px 0;}

  #player{display:none;width:100%;height:100%;background:#000;}

  #player video{width:100%;height:85%;background:#000;}
  #playerHint{font-size:9px;text-align:center;opacity:.7;}
</style>
</head>
<body>

<div id="err"></div>

<div id="camera" class="active">
  <video id="src" autoplay muted playsinline></video>
  <canvas id="preview"></canvas>
  <div id="modeLabel"><span class="name">16MM</span><span class="stock">KODAK VISION3 &middot; 24FPS</span></div>
  <div id="recIndicator"><div id="recDot"></div><span id="recTime">0:00</span></div>
  <button id="rotateBtn" title="rotate feed 90°">&#8635;</button>
  <button id="galleryBtn">&#9638;</button>
  <div id="hint">PTT: rec &middot; scroll: front/back cam &middot; hold: gallery</div>
</div>

<div id="gallery">
  <h3>Saved clips</h3>
  <div id="clipList"></div>
  <div id="galleryEmpty" style="display:none;">No clips yet</div>
  <div id="galleryHint">scroll: browse &middot; PTT: play &middot; tap &#10005;: delete &middot; hold: back</div>
</div>

<div id="player">
  <video id="playback" controls playsinline></video>
  <div id="playerHint">PTT: back to camera</div>
</div>

<div id="share">
  <h3>Share clip</h3>
  <div id="shareStatus">Uploading&hellip; 0%</div>
  <div id="shareError" style="display:none;">
    <div id="shareErrorMsg"></div>
    <div id="shareDiag"></div>
    <div id="shareErrorActions">
      <button id="shareRetryBtn">Retry</button>
      <button id="shareBackBtn">Back</button>
    </div>
  </div>
  <div id="shareQrWrap" style="display:none;">
    <img id="shareImg" width="170" height="170" alt="Download QR code">
    <div id="shareUrl"></div>
    <div id="shareExpiry">Link expires in 1 hour</div>
  </div>
  <div id="shareHint">PTT: back to gallery &middot; hold: camera</div>
</div>

<script>
"use strict";

/* ================= constants tuned for this hardware =================
   Carried over from sibling R1 creations (shaheer-cam / r1-video-creation)
   built and battle-tested for this same device:
   - SCREEN_ASPECT + rotation=90: the sensor is mounted rotated; cropping to
     this aspect after rotating is what makes the frame fill the screen
     right-side-up instead of sideways/letterboxed.
   - camera constraints (ideal facing, frameRate ideal 24/max 30, res
     ideal+min 1280x720): `ideal`-only res was settling for sub-720p and
     everything came out pixelated; `min` without `max` fixed it without
     the over-constrained negotiation that `min`+`max` together caused.
   - mp4/h264 preferred codec, 5Mbps video / 96kbps audio bitrate: proven
     ceiling before recording visibly lags on this hardware (8Mbps did lag).
   - recording reads the same canvas already being redrawn for the live
     view (zero marginal per-frame cost) instead of a second pipeline.
============================================================================ */
const SCREEN_ASPECT = 240 / 282;
// Default is 270° (90° counterclockwise from the old 90° default) — the
// sensor was coming in rotated the wrong way at 90°. Persisted + adjustable
// via the on-screen rotate button since camera mounting can vary by unit.
let rotation = parseInt(localStorage.getItem('r1-film-rotation') || '270', 10);
function setRotation(deg) {
  rotation = ((deg % 360) + 360) % 360;
  localStorage.setItem('r1-film-rotation', String(rotation));
}

// ---------- front/selfie camera ----------
// Confirmed on the sibling photo creation (shaheer-cam): requesting the
// opposite facingMode via getUserMedia actually drives the R1's motorized
// camera to physically rotate and face the user, not just a software mirror.
// The scroll wheel drives that directly here — up = selfie, down = back
// camera — and film-stock switching moved to the on-screen pill instead so
// the two controls never compete for the wheel.
let cachedFacing = localStorage.getItem('r1-film-facing') || 'environment';
function getFacing() { return cachedFacing; }
function setFacing(v) { cachedFacing = v; localStorage.setItem('r1-film-facing', v); }
function isSelfieMode() { return cachedFacing === 'user'; }

const PRESETS = {
  16: {
    label: '16MM', stock: 'KODAK VISION3 · 24FPS', fps: 24,
    // Vision3: warm, robust color with only *moderate* saturation and a
    // gentle highlight rolloff — contrast/brightness left untouched from
    // baseline on purpose (real film gets its look from color response, not
    // a punchier curve). tint is screen-blended, which can only ever
    // lighten/warm a pixel, never darken one.
    css: 'contrast(1.04) saturate(1.32) brightness(1.03) hue-rotate(-3deg)',
    tint: 'rgba(255,176,90,0.07)',
    weaveMax: 0.0022, rotMax: 0.0022, flickerRange: 0.02,
    vignette: { strength: 0.26, color: '6,10,16' },
    grainAlpha: 0.30, haloAlpha: 0.16,
  },
  8: {
    label: '8MM', stock: 'KODACHROME 40 · 18FPS', fps: 18,
    // Kodachrome's whole signature is vivid, punchy reds/golds — sepia()
    // was fighting that by desaturating toward brown, so it's gone; the
    // vividness now comes from saturation + a warm screen tint instead of
    // contrast, same reasoning as 16mm above.
    css: 'contrast(1.08) saturate(1.7) brightness(1.06) hue-rotate(-6deg)',
    tint: 'rgba(255,140,40,0.1)',
    // Gate weave (frame-shake) removed on request — it read as distracting
    // jitter rather than the intended subtle wobble. Frame rate (18fps) and
    // flicker are untouched.
    weaveMax: 0, rotMax: 0, flickerRange: 0.065,
    vignette: { strength: 0.5, color: '32,20,8' },
    grainAlpha: 0.44, haloAlpha: 0.26,
  },
};
let mode = 16;

// Default expiry for share-via-QR uploads (see shareClip below) — shortest
// option since that's plenty of time to scan-and-download right after
// recording; change this one line to make links live longer.
const SHARE_EXPIRY = '1h';
const SHARE_EXPIRY_LABEL = 'Link expires in 1 hour';

/* ---------- elements ---------- */
const els = {
  camera: document.getElementById('camera'),
  gallery: document.getElementById('gallery'),
  player: document.getElementById('player'),
  video: document.getElementById('src'),
  preview: document.getElementById('preview'),
  modeLabel: document.getElementById('modeLabel'),
  modeName: document.querySelector('#modeLabel .name'),
  modeStock: document.querySelector('#modeLabel .stock'),
  recIndicator: document.getElementById('recIndicator'),
  recTime: document.getElementById('recTime'),
  galleryBtn: document.getElementById('galleryBtn'),
  rotateBtn: document.getElementById('rotateBtn'),
  err: document.getElementById('err'),
  clipList: document.getElementById('clipList'),
  galleryEmpty: document.getElementById('galleryEmpty'),
  playback: document.getElementById('playback'),
  share: document.getElementById('share'),
  shareStatus: document.getElementById('shareStatus'),
  shareError: document.getElementById('shareError'),
  shareErrorMsg: document.getElementById('shareErrorMsg'),
  shareDiag: document.getElementById('shareDiag'),
  shareRetryBtn: document.getElementById('shareRetryBtn'),
  shareBackBtn: document.getElementById('shareBackBtn'),
  shareQrWrap: document.getElementById('shareQrWrap'),
  shareImg: document.getElementById('shareImg'),
  shareUrl: document.getElementById('shareUrl'),
  shareExpiry: document.getElementById('shareExpiry'),
};
els.shareExpiry.textContent = SHARE_EXPIRY_LABEL;
const previewCtx = els.preview.getContext('2d');

function showError(msg) { els.err.textContent = msg; els.err.style.display = 'block'; }

/* ---------- offscreen rotation canvas ---------- */
const rotCanvas = document.createElement('canvas');
const rotCtx = rotCanvas.getContext('2d');

let cropCacheRW = -1, cropCacheRH = -1, cropCacheW = 0, cropCacheH = 0, cropCacheX = 0, cropCacheY = 0;

// Draws the raw camera frame rotated + weave-perturbed into rotCanvas, then
// crops/scales that into the (already color-graded-on-draw) preview canvas.
// The weave offset/rotation is folded into this same transform, so gate
// weave costs nothing extra beyond what rotation already costs.
function drawFilmFrame(source, sw, sh, weave) {
  const swapped = rotation === 90 || rotation === 270;
  const rw = swapped ? sh : sw;
  const rh = swapped ? sw : sh;

  if (rotCanvas.width !== rw || rotCanvas.height !== rh) {
    rotCanvas.width = rw; rotCanvas.height = rh;
  }
  rotCtx.save();
  rotCtx.translate(rw / 2 + weave.x * rw, rh / 2 + weave.y * rh);
  rotCtx.rotate((rotation * Math.PI) / 180 + weave.rot);
  if (isSelfieMode()) rotCtx.scale(-1, 1);
  rotCtx.drawImage(source, -sw / 2, -sh / 2, sw, sh);
  rotCtx.restore();

  if (rw !== cropCacheRW || rh !== cropCacheRH) {
    cropCacheRW = rw; cropCacheRH = rh;
    cropCacheW = rw; cropCacheH = rh;
    if (rw / rh > SCREEN_ASPECT) cropCacheW = Math.round(rh * SCREEN_ASPECT);
    else cropCacheH = Math.round(rw / SCREEN_ASPECT);
    cropCacheX = Math.round((rw - cropCacheW) / 2);
    cropCacheY = Math.round((rh - cropCacheH) / 2);
  }

  if (els.preview.width !== cropCacheW || els.preview.height !== cropCacheH) {
    els.preview.width = cropCacheW; els.preview.height = cropCacheH;
  }

  const p = PRESETS[mode];
  const flicker = 1 + weave.flicker;
  previewCtx.filter = `${p.css} brightness(${flicker})`;
  previewCtx.drawImage(rotCanvas, cropCacheX, cropCacheY, cropCacheW, cropCacheH, 0, 0, cropCacheW, cropCacheH);
  previewCtx.filter = 'none';
}

/* ---------- cheap real-time film artifacts (no per-pixel work in the hot path) ---------- */

// A handful of noise tiles generated ONCE at boot, not regenerated every
// frame. A prior version of this pipeline (in a sibling creation) rebuilt a
// full-resolution noise canvas via a per-pixel loop every single frame and
// that was the main cause of the live view lagging on this hardware —
// picking between a few pre-baked tiles and letting the GPU scale/composite
// them gives the same flickering-grain look for near-zero per-frame cost.
// Sized well above screen resolution so grain reads as fine texture instead
// of blotchy upscaled noise when stretched over the preview canvas — this is
// still a one-time cost at boot, not a per-frame one, so raising it doesn't
// affect live performance at all.
const GRAIN_TILE_W = 480, GRAIN_TILE_H = 564;
const grainTiles = [];
(function initGrainTiles() {
  for (let i = 0; i < 6; i++) {
    const c = document.createElement('canvas');
    c.width = GRAIN_TILE_W; c.height = GRAIN_TILE_H;
    const cctx = c.getContext('2d');
    const id = cctx.createImageData(GRAIN_TILE_W, GRAIN_TILE_H);
    for (let p = 0; p < id.data.length; p += 4) {
      const v = Math.floor(Math.random() * 255);
      id.data[p] = v; id.data[p + 1] = v; id.data[p + 2] = v; id.data[p + 3] = 255;
    }
    cctx.putImageData(id, 0, 0);
    grainTiles.push(c);
  }
})();

function drawGrain(ctx, w, h, tileIdx, alpha) {
  const tile = grainTiles[tileIdx % grainTiles.length];
  ctx.save();
  ctx.globalAlpha = alpha;
  // 'soft-light' instead of 'overlay' — overlay is a hard multiply/screen
  // split that visibly punches contrast (crushes toward black/white) at
  // any alpha worth seeing. Soft-light perturbs tone gently around neutral
  // gray instead, so grain can be pushed much more visible (see the higher
  // grainAlpha values in PRESETS) without darkening or contrast-ing the image.
  ctx.globalCompositeOperation = 'soft-light';
  ctx.drawImage(tile, 0, 0, w, h);
  ctx.restore();
}

let vigGrad = null, vigW = -1, vigH = -1, vigColorKey = '';
function drawVignette(ctx, w, h, strength, color) {
  if (w !== vigW || h !== vigH || color !== vigColorKey) {
    vigW = w; vigH = h; vigColorKey = color;
    vigGrad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.75);
    vigGrad.addColorStop(0, `rgba(${color},0)`);
    vigGrad.addColorStop(1, `rgba(${color},1)`);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = strength;
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

// Halation (warm glow bleeding off highlights) done on a downsampled copy —
// blur cost scales with pixel count, so blurring at ~1/3 res and scaling the
// soft result back up keeps this cheap while looking identical (halation is
// meant to be soft/diffuse anyway). No light leaks anywhere in this pipeline.
const haloCanvas = document.createElement('canvas');
const haloCtx = haloCanvas.getContext('2d');
function drawHalation(ctx, srcCanvas, w, h, alpha) {
  const dw = Math.max(1, Math.round(w / 3)), dh = Math.max(1, Math.round(h / 3));
  if (haloCanvas.width !== dw || haloCanvas.height !== dh) { haloCanvas.width = dw; haloCanvas.height = dh; }
  haloCtx.filter = 'brightness(1.8) contrast(2.6) blur(2px)';
  haloCtx.drawImage(srcCanvas, 0, 0, dw, dh);
  haloCtx.filter = 'none';
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = alpha;
  ctx.drawImage(haloCanvas, 0, 0, w, h);
  ctx.restore();
}

// Color cast tint — 'screen' blend is mathematically incapable of ever
// darkening a pixel (screen(a,b) >= a always), so this can only add warmth/
// color, never the darkness or added contrast that was explicitly not
// wanted here.
function drawTint(ctx, w, h, rgba) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = rgba;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

/* ---------- film clock: holds random per-frame values at the real stock's fps ---------- */
let lastFilmFrame = 0;
let held = { x: 0, y: 0, rot: 0, flicker: 0, grainTile: 0 };

function rollFilmFrame() {
  const p = PRESETS[mode];
  held.x = (Math.random() * 2 - 1) * p.weaveMax;
  held.y = (Math.random() * 2 - 1) * p.weaveMax;
  held.rot = (Math.random() * 2 - 1) * p.rotMax;
  held.flicker = (Math.random() * 2 - 1) * p.flickerRange;
  held.grainTile = Math.floor(Math.random() * grainTiles.length);
}

function renderFilmFrame() {
  if (els.video.readyState < 2 || !els.video.videoWidth) return;
  drawFilmFrame(els.video, els.video.videoWidth, els.video.videoHeight, held);
  const p = PRESETS[mode];
  const w = els.preview.width, h = els.preview.height;
  drawTint(previewCtx, w, h, p.tint);
  drawGrain(previewCtx, w, h, held.grainTile, p.grainAlpha);
  drawVignette(previewCtx, w, h, p.vignette.strength, p.vignette.color);
  drawHalation(previewCtx, els.preview, w, h, p.haloAlpha);
}

let renderLoopStarted = false;
function renderLoop(ts) {
  requestAnimationFrame(renderLoop);
  const interval = 1000 / PRESETS[mode].fps;
  if (ts - lastFilmFrame >= interval) {
    lastFilmFrame = ts;
    rollFilmFrame();
    renderFilmFrame();
  }
}

/* ---------- mode switching (disabled mid-recording: captureStream fps is pinned at record start) ---------- */
function setMode(m) {
  if (isRecording) return;
  mode = m;
  els.modeName.textContent = PRESETS[m].label;
  els.modeStock.textContent = PRESETS[m].stock;
}

/* ---------- camera / mic init (fallback chain proven on this hardware) ---------- */
let cameraStream = null, micStream = null;

function buildCameraAttempts() {
  const facing = getFacing();
  const fr = { ideal: 24, max: 30 };
  const res = { width: { ideal: 1280, min: 1280 }, height: { ideal: 720, min: 720 } };
  return [
    { video: { facingMode: { ideal: facing }, frameRate: fr, ...res } },
    { video: { frameRate: fr, ...res } },
    { video: { facingMode: { ideal: facing } } },
    { video: true },
  ];
}

async function initCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach((t) => t.stop());
    cameraStream = null;
  }
  let lastErr = null;
  for (const constraints of buildCameraAttempts()) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      cameraStream = stream;
      els.video.srcObject = stream;
      await els.video.play();
      els.err.style.display = 'none';
      if (!renderLoopStarted) { renderLoopStarted = true; requestAnimationFrame(renderLoop); }
      return;
    } catch (err) { lastErr = err; }
  }
  showError('Camera access failed: ' + (lastErr ? lastErr.message : 'unknown error'));
}

async function initMic() {
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { micStream = null; console.warn('Mic unavailable, recording without sound:', err); }
}

/* ---------- recording ---------- */
let mediaRecorder = null, recordedChunks = [], isRecording = false, recordStartTime = 0, recordTimerInterval = null;

function pickVideoMimeType() {
  if (!window.MediaRecorder) return '';
  const candidates = ['video/mp4;codecs=h264', 'video/mp4', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
  for (const c of candidates) if (MediaRecorder.isTypeSupported(c)) return c;
  return '';
}

function updateRecTimer() {
  const secs = Math.floor((Date.now() - recordStartTime) / 1000);
  els.recTime.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}

function startRecording() {
  if (appView !== 'camera' || isRecording || !els.preview.width) return;
  if (!window.MediaRecorder) { showError('Video recording is not supported on this device'); return; }
  const mimeType = pickVideoMimeType();
  const fps = PRESETS[mode].fps;
  const stream = els.preview.captureStream(fps);
  const audioTrack = micStream && micStream.getAudioTracks()[0];
  if (audioTrack) stream.addTrack(audioTrack);
  recordedChunks = [];
  try {
    mediaRecorder = new MediaRecorder(stream, {
      ...(mimeType ? { mimeType } : {}),
      videoBitsPerSecond: 5000000,
      audioBitsPerSecond: 96000,
    });
  } catch (e) { showError('Could not start recording: ' + e.message); return; }
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();
  isRecording = true;
  recordStartTime = Date.now();
  els.recIndicator.classList.add('on');
  updateRecTimer();
  recordTimerInterval = setInterval(updateRecTimer, 500);
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recordTimerInterval);
  els.recIndicator.classList.remove('on');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function toggleRecording() { isRecording ? stopRecording() : startRecording(); }

async function onRecordingStopped() {
  if (!recordedChunks.length) return;
  const mimeStr = mediaRecorder.mimeType || 'video/webm';
  const blob = new Blob(recordedChunks, { type: mimeStr });
  await saveClip(blob, mode);
}

/* ---------- IndexedDB clip storage (video blobs are too big for creationStorage) ---------- */
let db;
const DB_NAME = 'r1filmlook', STORE = 'clips';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
let clips = [], selIndex = 0;
async function saveClip(blob, clipMode) {
  const clip = { id: Date.now(), ts: new Date().toLocaleString(), mode: PRESETS[clipMode].label, blob };
  await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(clip);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  clips.unshift(clip);
  renderGallery();
}
async function loadClips() {
  clips = await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => res(req.result.sort((a, b) => b.id - a.id));
    req.onerror = () => rej(req.error);
  });
  renderGallery();
}

function renderGallery() {
  els.clipList.innerHTML = '';
  els.galleryEmpty.style.display = clips.length ? 'none' : 'block';
  clips.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'clip' + (i === selIndex ? ' sel' : '');
    const info = document.createElement('span');
    info.className = 'info';
    info.innerHTML = `<span>${c.ts}</span><span class="badge">${c.mode}</span>`;
    div.appendChild(info);
    const shareBtn = document.createElement('button');
    shareBtn.className = 'clipShare';
    shareBtn.textContent = 'QR';
    shareBtn.title = 'share via QR code';
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareClip(c);
    });
    div.appendChild(shareBtn);
    const delBtn = document.createElement('button');
    delBtn.className = 'clipDelete';
    delBtn.textContent = '✕';
    delBtn.title = 'delete clip';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Delete this clip?')) deleteClip(c.id);
    });
    div.appendChild(delBtn);
    els.clipList.appendChild(div);
  });
}

async function deleteClip(id) {
  await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  const idx = clips.findIndex((c) => c.id === id);
  if (idx !== -1) clips.splice(idx, 1);
  if (selIndex >= clips.length) selIndex = Math.max(0, clips.length - 1);
  renderGallery();
}

/* ---------- share via QR (upload to an anonymous, auto-expiring temp host) ----------
   R1 Creations run in a browser sandbox with no way to host a local file
   server, so there's no way to hand the phone the clip directly — it has to
   briefly become reachable at a URL. litterbox.catbox.moe needs no account
   or API key (nothing to leak in this publicly-served page) and every link
   self-deletes after the chosen window (SHARE_EXPIRY, set above). */
function uploadXHR(form, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://litterbox.catbox.moe/resources/internals/api.php');
    xhr.timeout = 60000;
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      const text = (xhr.responseText || '').trim();
      if (xhr.status >= 200 && xhr.status < 300 && text.indexOf('http') === 0) {
        resolve(text);
      } else {
        // Surface exactly what the server sent back (litterbox returns plain-
        // text error reasons like file-too-large or bad reqtype) instead of a
        // generic message, so a real failure reason is visible on-device.
        reject(new Error(`server rejected upload — HTTP ${xhr.status}${text ? ': ' + text.slice(0, 100) : ' (empty response)'}`));
      }
    };
    xhr.onerror = () => {
      // A generic XHR error with no HTTP status at all (status stays 0) means
      // the request never got a response — could be no connectivity, a DNS
      // failure, or the R1's app sandbox blocking the cross-origin request
      // outright (different from a server-side rejection above).
      const err = new Error(`request never reached the server (status ${xhr.status})${navigator.onLine === false ? ' — device reports offline' : ' — possibly blocked by network/app sandbox, or connection dropped'}`);
      err.networkError = true;
      reject(err);
    };
    xhr.ontimeout = () => reject(new Error('upload timed out after 60s — connection may be too slow for this clip\'s size'));
    xhr.send(form);
  });
}

async function uploadViaFetch(form) {
  const res = await fetch('https://litterbox.catbox.moe/resources/internals/api.php', {
    method: 'POST',
    body: form,
  });
  const text = (await res.text()).trim();
  if (res.ok && text.indexOf('http') === 0) return text;
  throw new Error(`server rejected upload — HTTP ${res.status}${text ? ': ' + text.slice(0, 100) : ' (empty response)'}`);
}

async function uploadToLitterbox(form, onProgress) {
  try {
    return await uploadXHR(form, onProgress);
  } catch (e) {
    // Some app sandboxes intercept/block XMLHttpRequest uploads specifically
    // while leaving fetch() untouched. A fetch fallback costs nothing when
    // the failure is a real outage (fetch fails the same way) but recovers
    // the sandbox case. No upload-progress events are available via fetch.
    if (!e.networkError) throw e;
    onProgress(null);
    return await uploadViaFetch(form);
  }
}

// litterbox.catbox.moe sits behind Cloudflare, which has been seen to 403
// uploads specifically from the R1's outbound network/proxy (GETs and
// identical requests from a normal machine both succeed — this isn't a
// payload or header problem, it's IP-reputation-based on Cloudflare's side
// and out of this app's control). filebin.net is the fallback: no ads (a
// legitimate, reputable EU-hosted temp file service), permissive CORS, and
// GET on the upload URL 302s straight to a signed S3 link with the real
// content-type — no landing page for any ad script to hide in.
async function uploadToFilebin(blob, filename) {
  const bin = 'r1share-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
  const url = `https://filebin.net/${bin}/${filename}`;
  // fetch() auto-sets the Content-Type header from the Blob's own .type
  // (e.g. "video/webm") even with no headers specified here — that's not
  // one of the three CORS-safelisted content-types, so it triggers a
  // preflight that filebin.net's Access-Control-Allow-Headers doesn't
  // grant, blocking the request outright in a real browser (curl doesn't
  // enforce preflight at all, so this passed a curl-only check earlier but
  // silently never worked). Re-wrapping with a safelisted type avoids the
  // preflight; filebin sniffs the actual bytes for the real content-type
  // regardless of what's declared (verified: real webm bytes declared as
  // text/plain still came back reporting video/webm on download).
  const safeBlob = new Blob([blob], { type: 'text/plain' });
  const res = await fetch(url, { method: 'POST', body: safeBlob });
  if (!res.ok) throw new Error(`fallback host also rejected upload — HTTP ${res.status}`);
  return url;
}

let lastShareClip = null;

async function shareClip(clip) {
  lastShareClip = clip;
  setView('share');
  els.shareStatus.style.display = 'block';
  els.shareStatus.textContent = 'Uploading… 0%';
  els.shareError.style.display = 'none';
  els.shareQrWrap.style.display = 'none';

  const blob = clip.blob;
  const ext = blob.type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
  const filename = `${clip.mode.toLowerCase()}-${clip.id}.${ext}`;
  const form = new FormData();
  form.append('reqtype', 'fileupload');
  form.append('time', SHARE_EXPIRY);
  form.append('fileToUpload', blob, filename);

  let url, primaryErr;
  try {
    url = await uploadToLitterbox(form, (pct) => {
      els.shareStatus.textContent = pct === null ? 'Uploading… (retrying via fallback)' : `Uploading… ${pct}%`;
    });
  } catch (e) {
    primaryErr = e;
  }

  if (!url) {
    try {
      els.shareStatus.textContent = 'Primary host failed, trying fallback…';
      url = await uploadToFilebin(blob, filename);
    } catch (fallbackErr) {
      els.shareStatus.style.display = 'none';
      const sizeMb = (clip.blob.size / 1024 / 1024).toFixed(1);
      els.shareErrorMsg.textContent = `${primaryErr.message} — fallback also failed: ${fallbackErr.message} (clip size: ${sizeMb} MB)`;
      els.shareError.style.display = 'block';
      runConnectivityProbe();
      return;
    }
  }

  els.shareStatus.style.display = 'none';
  els.shareUrl.textContent = url;
  els.shareImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=' + encodeURIComponent(url);
  els.shareQrWrap.style.display = 'flex';
}

// Runs automatically on every share failure. First does plain GET reachability
// checks against three domains (rules domain-blocking in/out), then — since a
// GET succeeding doesn't prove a large POST upload will — actually performs a
// real tiny upload (a few bytes) to litterbox using the exact same code path
// as the real share. If the tiny upload succeeds where the full-size clip
// failed, that isolates the problem to payload size specifically, rather
// than the endpoint/method/CORS setup being broken.
const PROBE_TARGETS = [
  { name: 'this app (same-origin)', url: location.origin + location.pathname },
  { name: 'api.github.com', url: 'https://api.github.com/zen' },
  { name: 'litterbox.catbox.moe (GET)', url: 'https://litterbox.catbox.moe/' },
];

function probeOne(url, timeoutMs) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url + (url.indexOf('?') === -1 ? '?' : '&') + 'probe=' + Date.now());
    xhr.timeout = timeoutMs;
    xhr.onload = () => resolve({ ok: true, detail: 'HTTP ' + xhr.status });
    xhr.onerror = () => resolve({ ok: false, detail: 'blocked/unreachable (status ' + xhr.status + ')' });
    xhr.ontimeout = () => resolve({ ok: false, detail: 'timed out after ' + (timeoutMs / 1000) + 's' });
    xhr.send();
  });
}

async function probeTinyUpload() {
  const form = new FormData();
  form.append('reqtype', 'fileupload');
  form.append('time', '1h');
  form.append('fileToUpload', new Blob(['r1-connectivity-probe'], { type: 'text/plain' }), 'probe.txt');
  try {
    await uploadToLitterbox(form, () => {});
    return { ok: true, detail: 'tiny upload succeeded' };
  } catch (e) {
    return { ok: false, detail: e.message };
  }
}

async function probeTinyFallbackUpload() {
  try {
    await uploadToFilebin(new Blob(['r1-connectivity-probe'], { type: 'text/plain' }), 'probe.txt');
    return { ok: true, detail: 'tiny upload succeeded' };
  } catch (e) {
    return { ok: false, detail: e.message };
  }
}

async function runConnectivityProbe() {
  const rowNames = PROBE_TARGETS.map((t) => t.name)
    .concat('litterbox.catbox.moe (tiny POST upload)', 'filebin.net fallback (tiny POST upload)');
  els.shareDiag.innerHTML = rowNames
    .map((name) => `<div><span>${name}</span><span class="pending">testing…</span></div>`)
    .join('');
  const rows = els.shareDiag.children;
  for (let i = 0; i < PROBE_TARGETS.length; i++) {
    const result = await probeOne(PROBE_TARGETS[i].url, 8000);
    rows[i].innerHTML = `<span>${PROBE_TARGETS[i].name}</span><span class="${result.ok ? 'ok' : 'fail'}">${result.ok ? 'reachable' : result.detail}</span>`;
  }
  const primaryIdx = PROBE_TARGETS.length;
  const uploadResult = await probeTinyUpload();
  rows[primaryIdx].innerHTML = `<span>${rowNames[primaryIdx]}</span><span class="${uploadResult.ok ? 'ok' : 'fail'}">${uploadResult.detail}</span>`;
  const fallbackIdx = primaryIdx + 1;
  const fallbackResult = await probeTinyFallbackUpload();
  rows[fallbackIdx].innerHTML = `<span>${rowNames[fallbackIdx]}</span><span class="${fallbackResult.ok ? 'ok' : 'fail'}">${fallbackResult.detail}</span>`;
}

els.shareRetryBtn.addEventListener('click', () => { if (lastShareClip) shareClip(lastShareClip); });
els.shareBackBtn.addEventListener('click', () => setView('gallery'));

function playSelected() {
  const c = clips[selIndex];
  if (!c) return;
  els.playback.src = URL.createObjectURL(c.blob);
  setView('player');
  els.playback.play();
}

/* ---------- view switching ---------- */
let appView = 'camera'; // camera | gallery | player | share
function setView(v) {
  appView = v;
  els.camera.classList.toggle('active', v === 'camera');
  els.gallery.classList.toggle('active', v === 'gallery');
  els.player.classList.toggle('active', v === 'player');
  els.share.classList.toggle('active', v === 'share');
  if (v === 'gallery') renderGallery();
  if (v !== 'player') { els.playback.pause(); }
}

/* ---------- touch/click controls (also usable in a desktop browser) ---------- */
els.galleryBtn.addEventListener('click', () => setView(appView === 'camera' ? 'gallery' : 'camera'));
els.modeLabel.addEventListener('click', () => setMode(mode === 16 ? 8 : 16));
els.rotateBtn.addEventListener('click', () => setRotation(rotation + 90));

// Cooldown after a flip — carried over from the sibling photo creation,
// where the camera-flip motor settling into position was found to generate
// a phantom wheel-encoder tick some time later, which without this guard
// gets treated as a real scroll and flips the camera right back.
let lastFlipAt = 0;
const FLIP_COOLDOWN_MS = 5000;
function flipToFacing(target) {
  if (getFacing() === target) return;
  const now = Date.now();
  if (now - lastFlipAt < FLIP_COOLDOWN_MS) return;
  lastFlipAt = now;
  setFacing(target);
  initCamera();
}

/* ---------- R1 hardware hooks ---------- */
// PTT short press: sideClick. Long press: longPressStart. Scroll wheel: scrollUp/scrollDown.
// Scroll drives the camera flip (up = selfie, down = back), matching the
// sibling photo creation — film-stock switching lives on the on-screen pill
// instead so the two controls never compete for the wheel.
window.addEventListener('sideClick', () => {
  if (appView === 'camera') toggleRecording();
  else if (appView === 'gallery') playSelected();
  else if (appView === 'player') setView('camera');
  else if (appView === 'share') setView('gallery');
});
window.addEventListener('longPressStart', () => {
  if (appView === 'gallery' || appView === 'player' || appView === 'share') setView('camera');
  else if (appView === 'camera') setView('gallery');
});
window.addEventListener('scrollUp', () => {
  if (appView === 'camera') flipToFacing('user');
  else if (appView === 'gallery' && clips.length) { selIndex = Math.max(0, selIndex - 1); renderGallery(); }
});
window.addEventListener('scrollDown', () => {
  if (appView === 'camera') flipToFacing('environment');
  else if (appView === 'gallery' && clips.length) { selIndex = Math.min(clips.length - 1, selIndex + 1); renderGallery(); }
});

/* ---------- keyboard fallback for desktop testing ---------- */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { if (!e.repeat) { e.preventDefault(); toggleRecording(); } }
  else if (e.code === 'ArrowLeft') { if (appView === 'gallery') { selIndex = Math.max(0, selIndex - 1); renderGallery(); } else flipToFacing('user'); }
  else if (e.code === 'ArrowRight') { if (appView === 'gallery') { selIndex = Math.min(clips.length - 1, selIndex + 1); renderGallery(); } else flipToFacing('environment'); }
  else if (e.key === 'm') setMode(mode === 16 ? 8 : 16);
  else if (e.key === 'g') setView(appView === 'camera' ? 'gallery' : 'camera');
  else if (e.key === 'Enter') { if (appView === 'gallery') playSelected(); }
  else if (e.key === 'Escape') { if (appView !== 'camera') setView('camera'); }
});

/* ---------- boot ---------- */
(async function boot() {
  setMode(16);
  try { db = await openDB(); await loadClips(); } catch (e) { showError('Storage init failed: ' + e.message); }
  await initCamera();
  await initMic();
})();
</script>
</body>
</html>
